<!DOCTYPE html>
<html lang="ja" data-theme="wood">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>黄金比ソース手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   トークン（テーマ別カラー・タイポグラフィ）
   ========================================================== */
:root{
  --radius-s:10px; --radius-m:16px; --radius-l:26px;
  --font-display:'Shippori Mincho', serif;
  --font-body:'Zen Maru Gothic', sans-serif;
  --shadow: 0 6px 18px rgba(60,40,20,.12);
  --shadow-soft: 0 2px 8px rgba(60,40,20,.08);
}
html[data-theme="wood"]{
  --bg:#F1E2C8; --bg-alt:#E8D3AC; --surface:#FFF8EC; --surface-2:#FBEFDA;
  --text:#3E2A1A; --text-soft:#8A6F53;
  --accent:#B5651D; --accent-ink:#FFF8EC; --accent2:#6B8E4E; --accent3:#8C3B2E;
  --border:#D8BE8F; --border-soft:#E7D4AE;
  --cup-outline:#5C3A1E;
}
html[data-theme="modern"]{
  --bg:#F2F3F1; --bg-alt:#E7E9E6; --surface:#FFFFFF; --surface-2:#F7F8F7;
  --text:#1E2321; --text-soft:#6B756F;
  --accent:#2F6F6B; --accent-ink:#FFFFFF; --accent2:#E0A83E; --accent3:#C1533E;
  --border:#DDE1DE; --border-soft:#ECEFED;
  --cup-outline:#2F6F6B;
}
html[data-theme="japanese"]{
  --bg:#F6EFE0; --bg-alt:#ECE0C6; --surface:#FFFDF6; --surface-2:#FAF3E3;
  --text:#2A241C; --text-soft:#7C7260;
  --accent:#8C2F2F; --accent-ink:#FFF8EC; --accent2:#22543D; --accent3:#B5651D;
  --border:#DECDA3; --border-soft:#EEE2C2;
  --cup-outline:#2A241C;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, var(--bg-alt), transparent 55%),
    radial-gradient(circle at 100% 20%, var(--bg-alt), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  padding-bottom:96px;
  transition:background .5s ease, color .3s ease;
}
h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:.02em;}
button{font-family:var(--font-body); cursor:pointer;}
::selection{background:var(--accent); color:var(--accent-ink);}

.app{max-width:720px; margin:0 auto; padding:0 14px;}

/* ---------- ヘッダー ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 4px 10px;
}
.logo{
  font-size:1.5rem; font-weight:800; color:var(--text);
  display:flex; align-items:center; gap:8px;
}
.logo .mark{
  display:inline-block; width:30px; height:30px; border-radius:50%;
  background:var(--accent); position:relative; flex:none;
}
.logo .mark::after{
  content:"比"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--accent-ink); font-family:var(--font-display); font-weight:800; font-size:15px;
}
.theme-btn{
  border:1.5px solid var(--border); background:var(--surface); color:var(--text);
  padding:8px 12px; border-radius:999px; font-size:.78rem; font-weight:700;
  box-shadow:var(--shadow-soft); display:flex; align-items:center; gap:6px;
}
.theme-btn:active{transform:scale(.96);}
.theme-name{color:var(--text-soft); font-weight:500;}

/* ---------- 探し方切り替え ---------- */
.browse-toggle{
  display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:999px; padding:4px; margin:0 2px 10px;
}
.mode-btn{
  flex:1; border:none; background:transparent; color:var(--text-soft); font-weight:800; font-size:.82rem;
  padding:9px 6px; border-radius:999px; transition:all .2s ease;
}
.mode-btn.active{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow-soft);}

/* ---------- タブ ---------- */
.tabs{
  display:flex; gap:6px; overflow-x:auto; padding:4px 2px 12px; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:none; border:none; background:var(--surface); color:var(--text-soft);
  padding:10px 16px; border-radius:999px; font-size:.86rem; font-weight:700;
  border:1.5px solid var(--border-soft); transition:all .2s ease; white-space:nowrap;
}
.tab-btn.active{
  background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
  box-shadow:var(--shadow-soft); transform:translateY(-1px);
}

/* ---------- カード共通 ---------- */
.section-title{
  font-size:1.02rem; font-weight:700; margin:18px 2px 10px; display:flex; align-items:center; gap:8px;
}
.section-title .bar{width:5px; height:18px; background:var(--accent); border-radius:3px; display:inline-block;}

.sauce-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
  margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-soft);
}
.card-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 16px; cursor:pointer;
}
.card-head h3{font-size:1.02rem; color:var(--text); font-weight:700;}
.card-head .chev{color:var(--text-soft); transition:transform .25s ease; font-size:.85rem; flex:none;}
.sauce-card.open .card-head .chev{transform:rotate(180deg);}
.card-head-text{flex:1; min-width:0;}
.ratio-preview{font-size:.72rem; color:var(--text-soft); margin-top:3px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cat-badge{
  display:inline-block; font-size:.64rem; font-weight:800; color:var(--accent); background:var(--surface-2);
  border:1px solid var(--border-soft); border-radius:999px; padding:2px 8px; margin-bottom:4px;
}

/* ---------- カードの写真バナー（横幅いっぱい） ---------- */
.card-photo-banner{
  position:relative; display:block; width:100%; height:165px; overflow:hidden; cursor:pointer;
  background-size:cover; background-position:center; background-repeat:no-repeat;
  border-bottom:1px solid var(--border-soft);
}
.card-photo-banner.empty{
  background:
    radial-gradient(circle at 25% 15%, var(--bg-alt), transparent 60%),
    radial-gradient(circle at 90% 90%, var(--bg-alt), transparent 55%),
    var(--surface-2);
  border-bottom:2px dashed var(--border);
}
.card-photo-banner input[type=file]{display:none;}
.banner-placeholder{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:var(--text-soft); font-size:.84rem; font-weight:800; text-align:center; padding:0 20px;
}
.banner-placeholder .bp-emoji{font-size:2rem; opacity:.32;}
.banner-cam-overlay{
  position:absolute; right:10px; bottom:10px; background:rgba(20,14,8,.55); color:#fff;
  font-size:.7rem; font-weight:800; padding:6px 11px; border-radius:999px; display:flex; align-items:center; gap:4px;
  backdrop-filter:blur(2px);
}

/* ---------- 人数ボタン ---------- */
.serving-row{display:flex; gap:6px; margin-bottom:10px;}
.serving-btn{
  flex:1; border:1.5px solid var(--border-soft); background:var(--surface-2); color:var(--text);
  border-radius:10px; padding:8px 4px; font-size:.78rem; font-weight:800;
}
.serving-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

/* ---------- 食材タグチェック（マイソース登録） ---------- */
.tag-check-row{display:flex; flex-wrap:wrap; gap:6px;}
.tag-check{
  display:flex; align-items:center; gap:4px; background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:999px; padding:5px 10px; font-size:.74rem; color:var(--text);
}
.tag-check input{margin:0;}

.card-body{
  max-height:0; overflow:hidden; transition:max-height .35s ease;
  border-top:1px dashed var(--border);
}
.sauce-card.open .card-body{max-height:1400px;}
.card-body-inner{padding:16px;}

.weight-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.weight-label{font-size:.82rem; color:var(--text-soft); font-weight:700;}
.weight-val{font-size:1.15rem; font-weight:900; color:var(--accent);}
input[type=range]{
  width:100%; height:6px; border-radius:4px; appearance:none; background:var(--border-soft); margin:6px 0 16px;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent);
  border:3px solid var(--surface); box-shadow:0 1px 4px rgba(0,0,0,.3); cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:22px; height:22px; border-radius:50%; background:var(--accent); border:3px solid var(--surface); cursor:pointer;
}

/* ---------- 計量カップ ---------- */
.cup-area{display:flex; gap:14px; align-items:flex-start; margin-bottom:10px;}
.cup-svg-wrap{flex:none; width:118px;}
.cup-note{font-size:.66rem; color:var(--text-soft); text-align:center; margin-top:2px;}
.ingredient-list{list-style:none; margin:0; padding:0; flex:1; display:flex; flex-direction:column; gap:7px;}
.ingredient-row{display:flex; align-items:center; gap:8px; font-size:.86rem;}
.ing-dot{width:11px; height:11px; border-radius:4px; flex:none;}
.ing-name{flex:1; color:var(--text);}
.ing-amount{font-weight:800; color:var(--text); font-variant-numeric:tabular-nums;}

.dish-tags{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 4px;}
.dish-tag{
  background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text);
  padding:6px 11px; border-radius:999px; font-size:.76rem; font-weight:700;
  text-decoration:none; display:inline-flex; align-items:center; gap:4px; cursor:pointer;
  transition:background .15s ease, transform .15s ease;
}
.dish-tag:hover{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.dish-tag:active{transform:scale(.95);}
.dish-tag::before{content:"🍽";}
.dish-tag::after{content:"🔍"; font-size:.62rem; opacity:.6;}

.card-actions{display:flex; gap:8px; margin-top:14px;}
.btn{
  border:none; border-radius:999px; padding:10px 16px; font-size:.82rem; font-weight:800;
  display:flex; align-items:center; gap:6px; justify-content:center;
}
.btn-accent{background:var(--accent); color:var(--accent-ink);}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text);}
.btn-ghost{background:var(--surface-2); color:var(--text);}
.btn:active{transform:scale(.96);}
.btn.added{background:var(--accent2); color:#fff;}
.btn-block{width:100%;}

/* ---------- マイレシピ：追加フォーム ---------- */
.panel{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
  padding:16px; margin-bottom:16px; box-shadow:var(--shadow-soft);
}
.panel h3{font-size:.98rem; margin-bottom:10px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:.76rem; font-weight:700; color:var(--text-soft); margin-bottom:4px;}
.field input[type=text], .field input[type=number], .field textarea{
  width:100%; border:1.5px solid var(--border-soft); background:var(--surface-2);
  border-radius:var(--radius-s); padding:9px 11px; font-size:.88rem; font-family:var(--font-body); color:var(--text);
}
.field textarea{resize:vertical; min-height:54px;}
.ing-input-row{display:grid; grid-template-columns:1fr 70px 60px 30px; gap:6px; margin-bottom:6px;}
.ing-input-row input{border:1.5px solid var(--border-soft); background:var(--surface-2); border-radius:8px; padding:7px 8px; font-size:.8rem; color:var(--text); width:100%;}
.ing-input-row select{border:1.5px solid var(--border-soft); background:var(--surface-2); border-radius:8px; padding:7px 4px; font-size:.78rem; color:var(--text); width:100%;}
.remove-row{background:none; border:none; color:var(--accent3); font-size:1.1rem; font-weight:900;}
.add-row-btn{font-size:.76rem; color:var(--accent); background:none; border:1px dashed var(--border); border-radius:8px; padding:6px 10px; font-weight:700;}

/* ---------- 写真レシピ ---------- */
.photo-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.photo-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
  overflow:hidden; box-shadow:var(--shadow-soft);
}
.photo-card img{width:100%; height:110px; object-fit:cover; display:block; background:var(--surface-2);}
.photo-card .pc-body{padding:9px 10px;}
.photo-card .pc-title{font-size:.82rem; font-weight:800;}
.photo-card .pc-note{font-size:.7rem; color:var(--text-soft); margin-top:2px; line-height:1.4;}
.photo-empty{grid-column:1/-1; text-align:center; color:var(--text-soft); font-size:.8rem; padding:26px 0;}
.upload-box{
  border:2px dashed var(--border); border-radius:var(--radius-m); padding:18px; text-align:center;
  color:var(--text-soft); font-size:.82rem; margin-bottom:14px; background:var(--surface-2);
}
.upload-box input{display:none;}
.upload-box .up-btn{display:inline-block; margin-top:8px;}

/* ---------- 音声相談 ---------- */
.mic-fab{
  position:fixed; right:16px; bottom:96px; width:66px; height:66px; border-radius:50%;
  background:linear-gradient(145deg, #FF6B3D, #E23B2E); color:#fff; border:3px solid #fff;
  box-shadow:0 10px 24px rgba(226,59,46,.45); z-index:50; display:flex; align-items:center; justify-content:center;
}
.mic-fab svg{width:28px; height:28px; display:block;}
.mic-fab .ring{
  position:absolute; inset:-8px; border-radius:50%; border:2px solid rgba(226,59,46,.5); opacity:0;
}
.mic-fab.listening{animation:mic-bounce 1s infinite;}
.mic-fab.listening .ring{animation:mic-ring 1.4s infinite;}
@keyframes mic-ring{0%{transform:scale(.85); opacity:.9;}100%{transform:scale(1.5); opacity:0;}}
@keyframes mic-bounce{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

.voice-panel{
  position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--surface);
  border-radius:20px 20px 0 0; box-shadow:0 -8px 24px rgba(0,0,0,.2); padding:18px 18px 22px;
  max-width:720px; margin:0 auto; transform:translateY(0); transition:transform .3s ease;
}
.voice-panel.hidden{transform:translateY(120%); pointer-events:none;}
.voice-panel h3{font-size:.95rem; margin-bottom:8px;}
.voice-transcript{
  background:var(--surface-2); border-radius:var(--radius-s); padding:10px 12px; font-size:.85rem;
  min-height:40px; color:var(--text); margin-bottom:10px;
}
.voice-hint{font-size:.72rem; color:var(--text-soft); margin-bottom:10px;}
.voice-suggest-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
.voice-suggest{
  display:flex; align-items:center; justify-content:space-between; background:var(--surface-2);
  border-radius:var(--radius-s); padding:10px 12px; font-size:.82rem; font-weight:700;
}
.voice-manual{display:flex; gap:8px;}
.voice-manual input{flex:1; border:1.5px solid var(--border-soft); border-radius:999px; padding:9px 14px; font-size:.85rem; background:var(--surface-2); color:var(--text);}
.voice-close{position:absolute; top:12px; right:16px; background:none; border:none; font-size:1.1rem; color:var(--text-soft);}

/* ---------- 印刷リストバー ---------- */
.print-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--border-soft); box-shadow:0 -4px 14px rgba(0,0,0,.08);
}
.print-bar-inner{
  max-width:720px; margin:0 auto; padding:10px 14px; display:flex; align-items:center; gap:10px;
}
.print-count{
  flex:none; background:var(--accent3); color:#fff; font-weight:900; font-size:.78rem;
  width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.print-chips{flex:1; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;}
.print-chips::-webkit-scrollbar{display:none;}
.print-chip{
  flex:none; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:999px;
  padding:5px 10px 5px 12px; font-size:.72rem; font-weight:700; display:flex; align-items:center; gap:5px; white-space:nowrap;
}
.print-chip button{background:none; border:none; color:var(--text-soft); font-size:.85rem;}
.print-go{flex:none; background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px; padding:10px 14px; font-size:.78rem; font-weight:800; white-space:nowrap;}
.print-empty{font-size:.76rem; color:var(--text-soft); flex:1;}

/* ---------- 印刷モード ---------- */
.print-overlay{position:fixed; inset:0; background:var(--bg); z-index:200; overflow-y:auto; padding:18px;}
.print-overlay.hidden{display:none;}
.print-overlay-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; max-width:900px; margin-left:auto; margin-right:auto;}
.print-overlay-head h2{font-size:1.1rem;}
.print-sheet{
  max-width:900px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:14px;
}
@media (max-width:520px){.print-sheet{grid-template-columns:1fr;}}
.print-card{
  background:#fff; border:1.5px solid #ccc; border-radius:12px; padding:14px; color:#222; break-inside:avoid;
}
.print-card h4{font-family:var(--font-display); font-size:1.05rem; margin:0 0 6px; border-bottom:2px solid var(--accent); padding-bottom:6px;}
.print-card .pw{font-size:.75rem; color:#666; margin-bottom:8px;}
.print-card ul{margin:0; padding-left:18px; font-size:.85rem; line-height:1.7;}
.print-card .pdish{font-size:.72rem; color:#555; margin-top:6px;}
.print-card-img{width:100%; height:120px; object-fit:cover; border-radius:8px; margin-bottom:8px;}
.print-cup-area{display:flex; gap:10px; align-items:flex-start; margin-bottom:6px;}
.print-cup{flex:none; width:78px;}
.print-steps{margin:8px 0 0; padding-left:18px; font-size:.76rem; line-height:1.6; color:#333;}

/* ---------- 空表示 ---------- */
.empty-note{color:var(--text-soft); font-size:.82rem; text-align:center; padding:20px 0;}

/* ---------- 固定レシピ（おやつ等）カード ---------- */
.servings-tag{
  display:inline-block; background:var(--surface-2); border:1px solid var(--border-soft);
  color:var(--text-soft); font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:999px; margin-bottom:12px;
}
.steps-list{list-style:none; margin:10px 0 0; padding:0; counter-reset:step;}
.steps-list li{
  counter-increment:step; position:relative; padding:8px 0 8px 34px; font-size:.85rem; line-height:1.6;
  border-top:1px dashed var(--border-soft);
}
.steps-list li:first-child{border-top:none;}
.steps-list li::before{
  content:counter(step); position:absolute; left:0; top:8px; width:24px; height:24px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:.72rem; display:flex; align-items:center; justify-content:center;
}
.step-title{font-weight:800; margin-right:4px;}
.tip-box{
  margin-top:14px; background:var(--surface-2); border:1px dashed var(--border); border-radius:var(--radius-s);
  padding:10px 12px; font-size:.78rem; color:var(--text-soft); line-height:1.6;
}
.tip-box .tip-label{font-weight:800; color:var(--text); margin-right:4px;}

/* ---------- ケトン食：1日管理パネル ---------- */
.keto-panel{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
  padding:16px; margin-bottom:16px; box-shadow:var(--shadow-soft);
}
.keto-panel h3{font-size:.98rem; margin-bottom:4px;}
.keto-panel .sub{font-size:.72rem; color:var(--text-soft); margin-bottom:12px; line-height:1.5;}
.target-inputs{display:flex; gap:10px; margin-bottom:14px;}
.target-field{flex:1;}
.target-field label{display:block; font-size:.72rem; color:var(--text-soft); font-weight:700; margin-bottom:4px;}
.target-field .tf-row{display:flex; align-items:center; gap:4px;}
.target-field input[type=number]{
  width:100%; border:1.5px solid var(--border-soft); background:var(--surface-2); border-radius:var(--radius-s);
  padding:8px 9px; font-size:.9rem; color:var(--text); font-weight:800;
}
.gauge-block{margin-bottom:10px;}
.gauge-head{display:flex; justify-content:space-between; font-size:.78rem; font-weight:700; margin-bottom:4px;}
.gauge-head .gv{font-variant-numeric:tabular-nums; color:var(--text-soft); font-weight:600;}
.gauge-track{height:12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); overflow:hidden;}
.gauge-fill{height:100%; border-radius:8px; transition:width .35s ease; background:var(--accent2);}
.gauge-fill.over{background:var(--accent3);}

.meal-style-row{display:flex; gap:6px; margin:6px 0 12px;}
.meal-style-btn{
  flex:1; border:1.5px solid var(--border-soft); background:var(--surface-2); color:var(--text);
  border-radius:999px; padding:8px 4px; font-size:.72rem; font-weight:800;
}
.meal-style-btn.active{background:var(--accent2); border-color:var(--accent2); color:#fff;}
.meal-guide{display:flex; flex-direction:column; gap:6px; margin-bottom:4px;}
.meal-guide-row{

const STORAGE_KEY = "goldenSauceNotebook_v1";
const safeStorage = {
  get(key){
    try{ const v = window.localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  },
  set(key, val){
    try{ window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ return false; }
  }
};
function saveAppData(){
  safeStorage.set(STORAGE_KEY, {
    cardImages: state.cardImages,
    mineSauces: SAUCES.mine,
    photos: state.photos,
    themeIdx: state.themeIdx,
    ketoTargets: state.ketoTargets
  });
}
function loadAppData(){
  const d = safeStorage.get(STORAGE_KEY);
  if(!d) return;
  if(d.cardImages && typeof d.cardImages === "object") state.cardImages = d.cardImages;
  if(Array.isArray(d.mineSauces)) SAUCES.mine = d.mineSauces;
  if(Array.isArray(d.photos)) state.photos = d.photos;
  if(typeof d.themeIdx === "number" && THEMES[d.themeIdx]) state.themeIdx = d.themeIdx;
  if(d.ketoTargets && typeof d.ketoTargets.oil === "number") state.ketoTargets = d.ketoTargets;
}

function getWeight(s){
  if(state.weights[s.id] !== undefined) return state.weights[s.id];
  return s.baseWeight || 100;
}
function computeAmount(base, weight, baseWeight){
  const bw = baseWeight || 100;
  return Math.round((base * weight/bw) * 10)/10;
}
function computeNutrition(s, weight){
  const bw = s.baseWeight || 100;
  let oil=0, salt=0;
  s.ingredients.forEach(i=>{
    const scaled = i.amount * (weight/bw);
    if(i.oilFactor) oil += scaled * i.oilFactor;
    if(i.saltFactor) salt += scaled * i.saltFactor;
  });
  return {oil: Math.round(oil*10)/10, salt: Math.round(salt*10)/10};
}
function allSaucesFlat(){
  let arr=[];
  CATEGORIES.forEach(c=>{ (SAUCES[c.id]||[]).forEach(s=> arr.push(Object.assign({cat:c.id}, s))); });
  return arr;
}
function findSauce(id){ return allSaucesFlat().find(s=>s.id===id); }

const CUP_PATH = "M40,20 L160,20 L173,7 L184,14 L165,27 L150,206 Q150,215 141,215 L59,215 Q50,215 50,206 Z";
function buildCupSVG(uid, ingredients){
  const total = ingredients.reduce((s,i)=>s+i.amount,0) || 1;
  const top=27, bottom=206, usable = bottom-top;
  let y = bottom;
  let layers = "";
  let dividers = "";
  ingredients.forEach(ing=>{
    const h = (ing.amount/total)*usable;
    y -= h;
    layers += `<rect x="46" y="${y.toFixed(1)}" width="108" height="${(h+0.6).toFixed(1)}" fill="${colorFor(ing.name)}"></rect>`;
    if(y > top+0.5) dividers += `<line x1="46" y1="${y.toFixed(1)}" x2="154" y2="${y.toFixed(1)}" stroke="#fff" stroke-width="2.4" opacity=".85"/>`;
  });
  return `
  <svg viewBox="0 0 200 236" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="clip-${uid}"><path d="${CUP_PATH}"/></clipPath>
      <filter id="rough-${uid}" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n" seed="3"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
      </filter>
    </defs>

}

}
function removeFromKetoPlan(uid){

    </div>

    </div>

      <div class="gauge-head"><span>🧂 塩分</span><span class="gv" data-gv="salt">${totals.salt}g / ${t.salt}g</span></div>
      <div class="gauge-track"><div class="gauge-fill ${totals.salt>t.salt?"over":""}" data-gf="salt" style="width:${saltPct}%"></div></div>

    <div class="section-title" style="margin:16px 2px 8px;"><span class="bar"></span>今日の食事スタイル</div>

    </div>
    <div class="meal-guide">
      ${style.meals.map(m=>`<div class="meal-guide-row"><span class="mg-name">${m.name}</span><span class="mg-vals">オイル目安 ${Math.round(t.oil*m.oilRatio*10)/10}g ・ 塩分目安 ${Math.round(t.salt*m.saltRatio*10)/10}g</span></div>`).join("")}
    </div>

    ${state.ketoPlan.length>0 ? `
    <div class="plan-chips">
      ${state.ketoPlan.map(p=>`<span class="plan-chip">${p.name}（🛢${p.oil}g/🧂${p.salt}g）<button data-rmketoplan="${p.uid}">✕</button></span>`).join("")}

    <button class="plan-reset" id="resetKetoPlan">今日の記録をリセット</button>` : ""}

function updateKetoGauges(){
  const t = state.ketoTargets;
  const totals = ketoTotals();
  const oilPct = Math.min(100, Math.round((totals.oil/t.oil)*100 || 0));
  const saltPct = Math.min(100, Math.round((totals.salt/t.salt)*100 || 0));
  const gvOil = document.querySelector('[data-gv="oil"]'); if(gvOil) gvOil.textContent = `${totals.oil}g / ${t.oil}g`;
  const gvSalt = document.querySelector('[data-gv="salt"]'); if(gvSalt) gvSalt.textContent = `${totals.salt}g / ${t.salt}g`;
  const gfOil = document.querySelector('[data-gf="oil"]'); if(gfOil){ gfOil.style.width = oilPct+"%"; gfOil.classList.toggle("over", totals.oil>t.oil); }
  const gfSalt = document.querySelector('[data-gf="salt"]'); if(gfSalt){ gfSalt.style.width = saltPct+"%"; gfSalt.classList.toggle("over", totals.salt>t.salt); }
  const style = MEAL_STYLES.find(m=>m.id===state.ketoMealStyle) || MEAL_STYLES[0];
  document.querySelectorAll(".meal-guide-row .mg-vals").forEach((el,idx)=>{
    const m = style.meals[idx];
    if(m) el.textContent = `オイル目安 ${Math.round(t.oil*m.oilRatio*10)/10}g ・ 塩分目安 ${Math.round(t.salt*m.saltRatio*10)/10}g`;
  });
}

const micBtn = document.getElementById("micBtn");
const voicePanel = document.getElementById("voicePanel");
const voiceTranscript = document.getElementById("voiceTranscript");
const voiceSuggestList = document.getElementById("voiceSuggestList");
let recognition = null, listening=false;

function setupRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = "ja-JP"; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    voiceTranscript.textContent = text;
    handleVoiceQuery(text);
  };
  r.onend = ()=>{ listening=false; micBtn.classList.remove("listening"); };
  r.onerror = ()=>{ listening=false; micBtn.classList.remove("listening"); voiceTranscript.textContent = "うまく聞き取れませんでした。下のテキスト欄からも入力できます。"; };
  return r;
}

function handleVoiceQuery(text){
  state.voiceCountHint = extractCount(text);

  // 1. 料理名レベルの一致
  let matches = [];
  VOICE_MAP.forEach(m=>{
    if(m.kw.some(k=> text.includes(k))){
      m.ids.forEach(id=>{ if(!matches.find(x=>x.id===id)) matches.push({id, cat:m.cat}); });
    }
  });
  // 2. 一致が少ない場合は食材タグレベルでも探す（例：「魚」「パン」など幅広いキーワード）
  if(matches.length < 3){
    Object.keys(TAG_SYNONYMS).forEach(tag=>{
      if(TAG_SYNONYMS[tag].some(k=> text.includes(k))){
        allSaucesFlat().forEach(s=>{
          if((s.mainIngredientTags||[]).includes(tag) && !matches.find(x=>x.id===s.id)){
            matches.push({id:s.id, cat:s.cat});
          }
        });
      }
    });
  }

  if(matches.length===0){
    voiceSuggestList.innerHTML = `<div class="voice-suggest">ぴったりのソースが見つかりませんでした。「基本・和風」タブも見てみてください🍳</div>`;
    return;
  }
  const countNote = state.voiceCountHint ? `<div class="voice-hint">🔢「${state.voiceCountHint}」を人数の目安として認識しました。レシピを開くと自動で分量に反映されます。</div>` : "";
  voiceSuggestList.innerHTML = countNote + matches.slice(0,6).map(m=>{
    const s = findSauce(m.id);
    return `<div class="voice-suggest"><span>${s.name}（${s.dishes[0]}など）</span><button class="btn btn-accent" data-gosauce="${m.id}" data-gocat="${m.cat}">見る</button></div>`;
  }).join("");
}

micBtn.addEventListener("click", ()=>{
  voicePanel.classList.remove("hidden");
  if(!recognition) recognition = setupRecognition();
  if(!recognition){
    voiceTranscript.textContent = "このブラウザは音声認識に対応していません。下のテキスト欄をお使いください。";
    return;
  }
  if(listening){ recognition.stop(); listening=false; micBtn.classList.remove("listening"); return; }
  try{
    recognition.start(); listening=true; micBtn.classList.add("listening");
    voiceTranscript.textContent = "🎙 聞いています…";
  }catch(err){ /* already started */ }
});
document.getElementById("voiceClose").addEventListener("click", ()=> voicePanel.classList.add("hidden"));
document.getElementById("voiceManualBtn").addEventListener("click", ()=>{
  const v = document.getElementById("voiceManualInput").value.trim();
  if(!v) return;
  voiceTranscript.textContent = v;
  handleVoiceQuery(v);
});

/* ============================================================
   9. テーマ切り替え
   ============================================================ */
const themeBtn = document.getElementById("themeBtn");
const themeNameEl = document.getElementById("themeName");
function applyTheme(){
  const t = THEMES[state.themeIdx];
  document.documentElement.setAttribute("data-theme", t.key);
  themeNameEl.textContent = t.label;
  // カップの色は CSS 変数依存なので再描画
  renderContent();
}
themeBtn.addEventListener("click", ()=>{
  state.themeIdx = (state.themeIdx+1) % THEMES.length;
  applyTheme();
  saveAppData();
});

/* ============================================================
   10. 写真レシピ
   ============================================================ */
function renderPhotoGrid(){
  const grid = document.getElementById("photoGrid");
  if(!grid) return;
  if(state.photos.length===0){ grid.innerHTML = `<div class="photo-empty">まだ写真がありません📷</div>`; return; }
  grid.innerHTML = state.photos.slice().reverse().map(p=>`
    <div class="photo-card">
      <img src="${p.img}" alt="${p.title}">
      <div class="pc-body">
        <div class="pc-title">${p.title}</div>
        <div class="pc-note">${p.note||""}</div>
      </div>
    </div>`).join("");
}

/* ============================================================
   11. イベント委譲（動的要素）
   ============================================================ */
document.body.addEventListener("click", (e)=>{
  // タブ内カード開閉
  const head = e.target.closest("[data-toggle]");
  if(head){
    const id = head.dataset.toggle;
    state.openId = (state.openId===id) ? null : id;
    renderContent();
    return;
  }
  // 印刷リストに追加
  const addBtn = e.target.closest("[data-addprint]");
  if(addBtn){ addToPrintList(addBtn.dataset.addprint); return; }

  // 人数ボタン（1〜4人前）
  const servBtn = e.target.closest("[data-setweight]");
  if(servBtn){ applyWeightToCard(servBtn.dataset.setweight, parseInt(servBtn.dataset.wval,10)); return; }

  // ケトン食：食事スタイル切り替え
  const mealBtn = e.target.closest("[data-mealstyle]");
  if(mealBtn){ state.ketoMealStyle = mealBtn.dataset.mealstyle; renderContent(); return; }

  // ケトン食：今日の食事に追加／削除／リセット
  const addKeto = e.target.closest("[data-addketoplan]");
  if(addKeto){ addToKetoPlan(addKeto.dataset.addketoplan); return; }
  const rmKeto = e.target.closest("[data-rmketoplan]");
  if(rmKeto){ removeFromKetoPlan(rmKeto.dataset.rmketoplan); return; }
  if(e.target.id === "resetKetoPlan"){ state.ketoPlan = []; renderContent(); return; }

  // 保存データの削除（localStorage）
  if(e.target.id === "resetSavedData"){
    if(!confirm("写真・マイソースなど、この端末に保存したデータを削除します。よろしいですか？")) return;
    try{ window.localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state.cardImages = {}; state.photos = []; SAUCES.mine = [];
    renderContent();
    return;
  }

  // 印刷チップ削除
  const rm = e.target.closest("[data-rmprint]");
  if(rm){ removeFromPrintList(rm.dataset.rmprint); return; }

  // まとめて印刷
  if(e.target.id === "printGoBtn"){ openPrintMode(); return; }
  if(e.target.id === "doPrintBtn"){ window.print(); return; }
  if(e.target.id === "closePrintBtn"){ closePrintMode(); return; }

  // マイソース：材料行追加／削除
  if(e.target.id === "addIngRow"){ addIngRow(); return; }
  const rmRow = e.target.closest("[data-removerow]");
  if(rmRow){ const row = document.querySelector(`[data-rid="${rmRow.dataset.removerow}"]`); if(row) row.remove(); return; }

  // マイソース保存
  if(e.target.id === "saveMySauce"){
    const name = document.getElementById("myName").value.trim();
    const rows = Array.from(document.querySelectorAll("#myIngRows .ing-input-row"));
    const ingredients = rows.map(r=>{
      const nm = r.querySelector('[data-f="name"]').value.trim();
      const amt = parseFloat(r.querySelector('[data-f="amount"]').value);
      const unit = r.querySelector('[data-f="unit"]').value;
      return (nm && !isNaN(amt)) ? {name:nm, amount:amt, unit} : null;
    }).filter(Boolean);
    const dishesRaw = document.getElementById("myDishes").value.trim();
    const dishes = dishesRaw ? dishesRaw.split(/[,、]/).map(s=>s.trim()).filter(Boolean) : ["自分の一皿"];
    const mainIngredientTags = Array.from(document.querySelectorAll(".myTagCheck:checked")).map(c=>c.value);
    if(!name || ingredients.length===0){
      alert("ソース名と、材料を最低1つ入力してください。");
      return;
    }
    const id = "my_" + Date.now();
    SAUCES.mine.push({id, name, ingredients, dishes, mainIngredientTags});
    saveAppData();
    renderContent();
    return;
  }

  // 写真保存
  if(e.target.id === "savePhoto"){
    const title = document.getElementById("photoTitle").value.trim() || "無題の一皿";
    const note = document.getElementById("photoNote").value.trim();
    const fileInput = document.getElementById("photoInput");
    const file = fileInput.files && fileInput.files[0];
    if(!file){ alert("先に写真を選んでください。"); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      state.photos.push({id:Date.now(), title, note, img: ev.target.result});
      fileInput.value = ""; document.getElementById("photoTitle").value=""; document.getElementById("photoNote").value="";
      saveAppData();
      renderPhotoGrid();
    };
    reader.readAsDataURL(file);
    return;
  }

  // 音声提案から該当ソースへ移動
  const go = e.target.closest("[data-gosauce]");
  if(go){
    const sid = go.dataset.gosauce, cid = go.dataset.gocat;
    state.browseMode = "category"; state.tab = cid; state.openId = sid;
    if(state.voiceCountHint){
      const catInfo = CATEGORIES.find(c=>c.id===cid);
      const pg = (catInfo && catInfo.personGrams) || {1:100,2:200,3:300,4:400};
      const n = Math.min(4, Math.max(1, state.voiceCountHint));
      state.weights[sid] = pg[n];
      state.voiceCountHint = null;
    }
    renderBrowseToggle(); renderTabs(); renderContent();
    voicePanel.classList.add("hidden");
    setTimeout(()=>{
      const card = document.querySelector(`[data-sid="${sid}"]`);
      if(card) card.scrollIntoView({behavior:"smooth", block:"center"});
    }, 60);
    return;
  }
});

// スライダー（重量）操作
document.body.addEventListener("input", (e)=>{
  const slider = e.target.closest("[data-slider]");
  if(slider){
    const id = slider.dataset.slider;
    const w = parseInt(slider.value, 10);
    applyWeightToCard(id, w);
    return;
  }
  const targetInput = e.target.closest("[data-target]");
  if(targetInput){
    const key = targetInput.dataset.target;
    const v = parseFloat(targetInput.value);
    state.ketoTargets[key] = isNaN(v) ? 0 : v;
    updateKetoGauges();
    saveAppData();
    return;
  }
});

// レシピカードの写真アップロード
document.body.addEventListener("change", (e)=>{
  const imgInput = e.target.closest("[data-cardimg]");
  if(imgInput){
    const id = imgInput.dataset.cardimg;
    const file = imgInput.files && imgInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      state.cardImages[id] = ev.target.result;
      saveAppData();
      renderContent();
    };
    reader.readAsDataURL(file);
    return;
  }
});

   初期化
   ============================================================ */
loadAppData();
document.documentElement.setAttribute("data-theme", THEMES[state.themeIdx].key);
themeNameEl.textContent = THEMES[state.themeIdx].label;
renderBrowseToggle();
renderTabs();
renderContent();
})();
